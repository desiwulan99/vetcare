services:
  database:
    image: postgres:16-alpine
    container_name: vetcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      POSTGRES_DB: ${POSTGRES_DB:-vetcare_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetcare_user} -d ${POSTGRES_DB:-vetcare_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vetcare-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-vetcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      POSTGRES_DB: ${POSTGRES_DB:-vetcare_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vetcare_user}:${POSTGRES_PASSWORD:-example_password}@database:5432/${POSTGRES_DB:-vetcare_db}?schema=public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - vetcare-network

  nginx:
    image: nginx:alpine
    container_name: vetcare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - vetcare-network

volumes:
  postgres_data:
    name: vetcare_postgres_data

networks:
  vetcare-network:
    name: vetcare-network
    driver: bridge
