events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format to include upstream server address
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        application/xml;

    # Rate Limiting Configuration
    # Rate: 5 requests per second per IP, zone size 10MB
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    # Upstream Load Balancing Configuration with Shared Memory Zone
    upstream vetcare_backend {
        zone backend_zone 64k;
        server backend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Global Security Headers (always included on all responses)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Response header showing which backend replica handled the request
        add_header X-Upstream $upstream_addr always;

        # Route /api/ with Rate Limiting and Reverse Proxy
        location /api/ {
            # Enforce rate limiting with burst capacity
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://vetcare_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Route other endpoints (Root /, /health, /docs) without strict rate limit
        location / {
            proxy_pass http://vetcare_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
